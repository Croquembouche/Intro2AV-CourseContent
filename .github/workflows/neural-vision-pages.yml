name: Publish course demos
on:
  push:
    branches: [main]
    paths:
      - '2026/Labs/NeuralVision/**'
      - '2026/Labs/SensorFusion/**'
      - '2026/Labs/Localization/**'
      - '2026/Presentations/Lecture 5 Localization for Autonomous Driving.pptx'
      - '2026/Data/Lecture5_Localization.zip'
      - '2026/Labs/Portal/**'
      - '2026/Presentations/Lecture 4 Sensor Fusion for Autonomous Driving.pptx'
      - '2026/Data/Lecture4_SensorFusion.zip'
      - '.github/workflows/neural-vision-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neural-vision-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install model export dependency
        run: python -m pip install numpy==2.2.6
      - name: Check browser and reference model agreement
        run: python 2026/Labs/NeuralVision/tests/verify_browser.py
      - name: Build the public demo and student download
        run: python 2026/Labs/NeuralVision/tools/build_pages.py --output .build/pages
      - name: Add Sensor Fusion demos and Lecture 4 downloads
        run: |
          mkdir -p .build/pages/sensor-fusion .build/pages/downloads
          cp -R 2026/Labs/SensorFusion/. .build/pages/sensor-fusion/
          cp "2026/Presentations/Lecture 4 Sensor Fusion for Autonomous Driving.pptx" .build/pages/downloads/
          cp 2026/Data/Lecture4_SensorFusion.zip .build/pages/downloads/
      - name: Add Localization demos and Lecture 5 downloads
        run: |
          mkdir -p .build/pages/localization .build/pages/downloads
          cp -R 2026/Labs/Localization/. .build/pages/localization/
          cp "2026/Presentations/Lecture 5 Localization for Autonomous Driving.pptx" .build/pages/downloads/
          cp 2026/Data/Lecture5_Localization.zip .build/pages/downloads/
      - name: Build course demo entry page
        run: python 2026/Labs/Portal/build_portal.py --output .build/pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .build/pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
